apiVersion: apps/v1
kind: Deployment
metadata:
  name: phantom-diff
spec:
  replicas: 1                       # Git says 1 ...
  selector:
    matchLabels:
      app: phantom-diff
  template:
    metadata:
      labels:
        app: phantom-diff
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
