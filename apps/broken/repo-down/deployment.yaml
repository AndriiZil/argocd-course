apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-down
spec:
  replicas: 2
  selector:
    matchLabels:
      app: repo-down
  template:
    metadata:
      labels:
        app: repo-down
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            - containerPort: 9898
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
