apiVersion: batch/v1
kind: Job
metadata:
  name: notify-failure
  annotations:
    argocd.argoproj.io/hook: SyncFail                        # only if the sync fails
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: notify
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          command: ["sh", "-c", "echo the sync of sync-demo failed"]
