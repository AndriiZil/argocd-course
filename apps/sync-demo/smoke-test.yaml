apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync                        # after everything is healthy
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          command: ["podcli", "check", "http", "storefront:9898/healthz"]
