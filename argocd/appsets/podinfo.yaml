apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: podinfo
  namespace: argocd
spec:
  goTemplate: true               # (1) write {{ .name }}, with a leading dot
  goTemplateOptions: ["missingkey=error"]   # (2) a misspelled name is an error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:                    # (3) where the parameter sets come from
    - git:
        repoURL: https://github.com/AndriiZil/argocd-course.git
        revision: main
        directories:
          - path: apps/podinfo/overlays/*   # (4) one set per matching folder
  template:                      # (5) an Application with holes in it
    metadata:
      name: 'podinfo-{{ .path.basename }}'   # (6) the holes: dev, prod ...
    spec:
      project: default
      source:
        repoURL: https://github.com/AndriiZil/argocd-course.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'tinyshop-{{ .path.basename }}'
      syncPolicy:                # (7) every generated Application syncs by itself
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
