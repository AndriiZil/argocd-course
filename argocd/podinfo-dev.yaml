apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AndriiZil/argocd-course.git
    targetRevision: main
    path: apps/podinfo/overlays/dev      # the overlay, not the base
  destination:
    server: https://kubernetes.default.svc
    namespace: tinyshop-dev
  syncPolicy:
    automated:                           # dev follows Git by itself
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
