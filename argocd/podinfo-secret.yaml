apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AndriiZil/argocd-course.git
    targetRevision: main
    path: apps/podinfo-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: secrets-demo
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
