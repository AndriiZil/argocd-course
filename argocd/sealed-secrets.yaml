apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets   # (1) the chart repository
      chart: sealed-secrets
      targetRevision: 2.22.0                              # the chart version, pinned
      helm:
        valueFiles: [$values/platform/sealed-secrets/values.yaml]   # (2) from our Git
    - repoURL: https://github.com/AndriiZil/argocd-course.git
      targetRevision: main
      ref: values                                         # (3) the name used as $values
  destination: { server: https://kubernetes.default.svc, namespace: sealed-secrets }
  syncPolicy:
    automated: {}
    syncOptions: [CreateNamespace=true]
