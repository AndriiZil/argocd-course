# Local users and roles for the TinyShop team. Layer it over setup/values-local.yaml.
configs:
  cm:
    accounts.alice: login          # alice logs in with a password
    accounts.ci: apiKey            # ci has no password: it only gets API tokens
  rbac:
    policy.default: ""             # a user with no role can do nothing
    policy.csv: |
      # (1) p: who, what, which action, on which object, allow or deny
      p, role:tinyshop-dev, applications, get, tinyshop/*, allow
      p, role:tinyshop-dev, applications, sync, tinyshop/*, allow
      # (2) logs and projects are separate resources, each needs its own line
      p, role:tinyshop-dev, logs, get, tinyshop/*, allow
      p, role:tinyshop-dev, projects, get, tinyshop, allow
      # (3) update changes the Application only, not the resources it manages
      p, role:tinyshop-dev, applications, update, tinyshop/*, allow
      # (4) update/<group>/<kind>/<ns>/<name> reaches resources: Deployments only
      p, role:tinyshop-dev, applications, update/apps/Deployment/*/*, tinyshop/*, allow
      # (5) deny wins over allow
      p, role:tinyshop-dev, applications, sync, tinyshop/shop-prod, deny
      # (6) the CI account may read and sync, nothing more
      p, role:tinyshop-ci, applications, get, tinyshop/*, allow
      p, role:tinyshop-ci, applications, sync, tinyshop/*, allow
      # (7) g: put a user, or an SSO group, into a role
      g, alice, role:tinyshop-dev
      g, ci, role:tinyshop-ci
