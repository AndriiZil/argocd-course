apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-external-secrets
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels:
            platform: "true"
  template:
    metadata:
      name: '{{.name}}-external-secrets'
    spec:
      project: default
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 2.15.0
        helm:
          releaseName: external-secrets
      destination:
        server: '{{.server}}'
        namespace: external-secrets
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true       # the CRDs are too large for a client-side apply
