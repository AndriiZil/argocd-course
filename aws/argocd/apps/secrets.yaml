apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: secrets
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels:
            platform: "true"
  template:
    metadata:
      name: '{{.name}}-secrets'
    spec:
      project: default
      source:
        repoURL: https://github.com/AndriiZil/argocd-course.git
        targetRevision: main
        path: 'aws/platform/secrets/{{.metadata.labels.env}}'   # hub, dev or prod
      destination:
        server: '{{.server}}'
        namespace: external-secrets
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions:
          - ServerSideApply=true
        retry:                         # the CRDs come from another Application
          limit: 5
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
