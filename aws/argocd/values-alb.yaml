# Argo CD behind an AWS Application Load Balancer (ALB) with an ACM certificate.
global:
  domain: argocd.tinyshop.example   # an example domain: the Ingress host and the URL
configs:
  params:
    server.insecure: true           # (1) TLS ends at the ALB. UNTESTED with an ALB
server:
  ingress:
    enabled: true
    controller: aws                 # (2) adds a gRPC Service and a rule for the CLI
    ingressClassName: alb
    aws:
      serviceType: ClusterIP        #     target-type ip: the ALB talks to pod IPs
    annotations:                    # (3) read by the AWS Load Balancer Controller
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/certificate-arn: >-          # an example ARN
        arn:aws:acm:eu-central-1:123456789012:certificate/EXAMPLE-ID
      alb.ingress.kubernetes.io/healthcheck-path: /grpc.health.v1.Health/Check
      alb.ingress.kubernetes.io/success-codes: "0"           # and a gRPC health check
