apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      prefix: tinyshop/hub/
---
# Dex reads this Secret as $argocd-github:clientSecret (see values-day2.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: argocd-github
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef:
        key: argocd-github
        property: clientSecret
---
# The Slack notifier reads token: $slack-token from argocd-notifications-secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: argocd-notifications-secret
  data:
    - secretKey: slack-token
      remoteRef:
        key: slack
        property: token
