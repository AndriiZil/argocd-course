apiVersion: v1
kind: Namespace
metadata:
  name: tinyshop
---
# region: eso
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      prefix: tinyshop/prod/            # (1) every key below starts with this
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storefront
  namespace: tinyshop
spec:
  refreshInterval: 1h                  # (2) how often ESO looks again
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: storefront                   # (3) the Kubernetes Secret ESO creates
  data:
    - secretKey: api-key
      remoteRef:
        key: storefront                # (4) tinyshop/prod/storefront ...
        property: api-key              #     ... and the JSON field inside it
# endregion
